[pytest]
# Minimal config (recon Q5). Pins discovery to tests/ and disables the pytest
# cache dir clutter. Deliberately NOT setting `filterwarnings = error`: the suite
# is clean under `-W error` today, but coupling its health to third-party
# (torch/transformers/fastembed) deprecation-warning churn would make it brittle
# to dependency bumps — the recon flagged the flakiness concern as overstated.
testpaths = tests
addopts = -p no:cacheprovider
